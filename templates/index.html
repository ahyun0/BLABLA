<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BLABLA — 글로벌 슬랭 AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

<!-- ① SELECT SCREEN -->
<div class="screen active" id="screen-select">

  <div class="select-bg-orb orb1"></div>
  <div class="select-bg-orb orb2"></div>

  <!-- 우상단 내 프로필 버튼 -->
  <button class="floating-profile-btn" id="open-mypage-select">
    <div class="floating-avatar" id="select-user-avatar-wrap">
      <img id="select-user-avatar-img" class="avatar-photo hidden" alt="프로필">
      <span class="avatar-fallback">👤</span>
    </div>
  </button>

  <div class="logo-wrap">
    <div class="logo-badge">🗣️</div>
    <div class="logo-title">BLABLA</div>
    <div class="logo-sub">현지인처럼 말하는 글로벌 슬랭 AI</div>
  </div>

  <p class="select-heading">어떤 말투로 대화할까요?</p>

  <div class="style-grid">

    <div class="style-card" data-style="japan_gyaru">
      <div class="card-glow" style="--glow: var(--c-japan)"></div>
      <div class="card-avatar-wrap av-japan">
        <img class="card-avatar-img" src="/static/images/japan_gyaru.png" alt="일본 갸루">
        <span class="card-av-label">JP</span>
      </div>
      <span class="lang-name">일본 갸루</span>
      <span class="lang-desc">밝고 귀여운 갸루체</span>
      <span class="card-dot"></span>
    </div>

    <div class="style-card" data-style="korea_mz">
      <div class="card-glow" style="--glow: var(--c-korea)"></div>
      <div class="card-avatar-wrap av-korea">
        <img class="card-avatar-img" src="/static/images/korea_mz.png" alt="한국 MZ">
        <span class="card-av-label">MZ</span>
      </div>
      <span class="lang-name">한국 MZ</span>
      <span class="lang-desc">인터넷 밈 말투</span>
      <span class="card-dot"></span>
    </div>

    <div class="style-card" data-style="us_casual">
      <div class="card-glow" style="--glow: var(--c-us)"></div>
      <div class="card-avatar-wrap av-us">
        <img class="card-avatar-img" src="/static/images/us_casual.png" alt="미국 캐주얼">
        <span class="card-av-label">US</span>
      </div>
      <span class="lang-name">미국 캐주얼</span>
      <span class="lang-desc">Gen Z 슬랭</span>
      <span class="card-dot"></span>
    </div>

    <div class="style-card" data-style="uk_casual">
      <div class="card-glow" style="--glow: var(--c-uk)"></div>
      <div class="card-avatar-wrap av-uk">
        <img class="card-avatar-img" src="/static/images/uk_casual.png" alt="영국 슬랭">
        <span class="card-av-label">UK</span>
      </div>
      <span class="lang-name">영국 슬랭</span>
      <span class="lang-desc">영국식 캐주얼</span>
      <span class="card-dot"></span>
    </div>

    <div class="style-card full-width" data-style="au_casual">
      <div class="card-glow" style="--glow: var(--c-au)"></div>
      <div class="card-avatar-wrap av-au">
        <img class="card-avatar-img" src="/static/images/au_casual.png" alt="호주 슬랭">
        <span class="card-av-label">AU</span>
      </div>
      <span class="lang-name">호주 슬랭</span>
      <span class="lang-desc">여유로운 호주 말투</span>
      <span class="card-dot"></span>
    </div>

  </div>

</div>

<!-- ② CHAT SCREEN -->
<div class="screen" id="screen-chat">

  <div class="page-header">
    <button class="back-icon" id="back-from-chat">←</button>
    <div class="header-ai-avatar" id="chat-header-ai-avatar-wrap">
      <img id="chat-header-ai-img" class="avatar-photo hidden" alt="">
      <span class="avatar-fallback" id="chat-header-ai-label">?</span>
    </div>
    <div class="header-info">
      <div class="header-name" id="chat-header-name">일본 갸루</div>
      <div class="header-mode">슬랭 AI · 온라인</div>
    </div>
    <button class="header-user-btn" id="open-mypage-chat">
      <div class="header-user-avatar" id="chat-header-user-wrap">
        <img id="chat-header-user-img" class="avatar-photo hidden" alt="나">
        <span class="avatar-fallback">👤</span>
      </div>
    </button>
  </div>

  <!-- 모국어 선택 탭 -->
  <div class="lang-selector-bar">
    <span class="lang-selector-label">해석 언어</span>
    <div class="lang-tabs">
      <button class="lang-tab active" data-lang="ko">한국어</button>
      <button class="lang-tab" data-lang="ja">日本語</button>
      <button class="lang-tab" data-lang="zh">中文</button>
      <button class="lang-tab" data-lang="en">English</button>
    </div>
  </div>

  <div class="chat-messages" id="chat-messages">
    <div class="typing-indicator" id="typing-indicator">
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
    </div>
  </div>

  <div class="chat-input-area">
    <button class="mic-btn" id="mic-btn" title="음성 입력">🎤</button>
    <textarea
      class="chat-text-input"
      id="chat-input"
      rows="1"
      placeholder="메시지를 입력하거나 🎤 를 눌러 말하세요…"
    ></textarea>
    <button class="send-btn" id="send-btn" title="전송">➤</button>
  </div>

</div>

<!-- ③ MY PAGE SCREEN -->
<div class="screen" id="screen-mypage">

  <div class="page-header">
    <button class="back-icon" id="back-from-mypage">←</button>
    <div class="header-info">
      <div class="header-name">마이페이지</div>
      <div class="header-mode">프로필 설정</div>
    </div>
  </div>

  <div class="mypage-body">
    <div class="mypage-avatar-section">
      <div class="mypage-avatar-wrap">
        <img id="mypage-avatar-img" class="avatar-photo hidden" alt="프로필">
        <span class="avatar-fallback mypage-av-fallback">👤</span>
        <label class="avatar-edit-overlay" for="avatar-file-input">
          <span class="camera-icon">📷</span>
        </label>
        <input type="file" id="avatar-file-input" accept="image/*">
      </div>
      <p class="mypage-hint">사진을 눌러 프로필 사진 변경</p>
    </div>

    <div class="mypage-actions">
      <button class="mypage-delete-btn" id="delete-avatar-btn">프로필 사진 삭제</button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="/static/js/app.js"></script>
</body>
</html>
