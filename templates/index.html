<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BLABLA — 글로벌 AI 회화</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

<!-- ① SELECT SCREEN -->
<div class="screen active" id="screen-select">

  <div class="select-bg-orb orb1"></div>
  <div class="select-bg-orb orb2"></div>

  <!-- 우상단 내 프로필 버튼 -->
  <button class="floating-profile-btn" id="open-mypage-select">
    <div class="floating-avatar" id="select-user-avatar-wrap">
      <img id="select-user-avatar-img" class="avatar-photo hidden" alt="프로필">
      <span class="avatar-fallback">👤</span>
    </div>
  </button>

  <div class="logo-wrap">
    <div class="logo-badge">🗣️</div>
    <div class="logo-title">BLABLA</div>
    <div class="logo-sub">현지인처럼 말하는 글로벌 AI 회화</div>
  </div>

  <!-- Step 1: 언어 선택 -->
  <div class="select-step" id="step-language">
    <p class="select-heading">어떤 언어로 대화할까요?</p>
    <div class="lang-grid">

      <div class="lang-card" data-lang="ko">
        <span class="lang-flag">🇰🇷</span>
        <span class="lang-card-name">한국어</span>
        <span class="lang-dot"></span>
      </div>

      <div class="lang-card" data-lang="ja">
        <span class="lang-flag">🇯🇵</span>
        <span class="lang-card-name">日本語</span>
        <span class="lang-dot"></span>
      </div>

      <div class="lang-card" data-lang="en_us">
        <span class="lang-flag">🇺🇸</span>
        <span class="lang-card-name">English US</span>
        <span class="lang-dot"></span>
      </div>

      <div class="lang-card" data-lang="zh">
        <span class="lang-flag">🇨🇳</span>
        <span class="lang-card-name">中文</span>
        <span class="lang-dot"></span>
      </div>

    </div>
  </div>

  <!-- Step 2: 카테고리 선택 -->
  <div class="select-step hidden" id="step-category">

    <button class="back-step-btn" id="back-to-lang">← 언어 변경</button>
    <p class="select-heading" id="step2-heading">어떤 상황에서 연습할까요?</p>
    <div class="category-grid">

      <div class="category-card" data-category="friend">
        <span class="cat-icon">🗣️</span>
        <span class="cat-name">친구</span>
        <span class="cat-persona" id="persona-friend">—</span>
        <span class="cat-desc">슬랭 · 캐주얼</span>
      </div>

      <div class="category-card" data-category="business">
        <span class="cat-icon">💼</span>
        <span class="cat-name">비즈니스</span>
        <span class="cat-persona" id="persona-business">—</span>
        <span class="cat-desc">직장 · 학교</span>
      </div>

      <div class="category-card" data-category="travel">
        <span class="cat-icon">✈️</span>
        <span class="cat-name">여행</span>
        <span class="cat-persona" id="persona-travel">—</span>
        <span class="cat-desc">실용 여행 표현</span>
      </div>

    </div>
  </div>

  <!-- Step 3: 미션 선택 -->
  <div class="select-step hidden" id="step-mission">
    <button class="back-step-btn" id="back-to-category">← 상황 변경</button>
    <p class="select-heading">오늘의 미션을 선택하세요</p>
    <div class="mission-grid" id="mission-grid">
      <!-- JS로 동적 생성 -->
    </div>
    <button class="skip-mission-btn" id="skip-mission">미션 없이 자유 대화 →</button>
  </div>

</div>

<!-- ② CHAT SCREEN -->
<div class="screen" id="screen-chat">

  <div class="page-header">
    <button class="back-icon" id="back-from-chat">←</button>
    <div class="header-ai-avatar" id="chat-header-ai-avatar-wrap">
      <img id="chat-header-ai-img" class="avatar-photo hidden" alt="">
      <span class="avatar-fallback" id="chat-header-ai-label">?</span>
    </div>
    <div class="header-info">
      <div class="header-name" id="chat-header-name">—</div>
      <div class="header-mode" id="chat-header-mode">AI · 온라인</div>
    </div>
    <button class="header-user-btn" id="open-mypage-chat">
      <div class="header-user-avatar" id="chat-header-user-wrap">
        <img id="chat-header-user-img" class="avatar-photo hidden" alt="나">
        <span class="avatar-fallback">👤</span>
      </div>
    </button>
  </div>

  <!-- 모국어 선택 탭 -->
  <div class="lang-selector-bar">
    <span class="lang-selector-label">해석 언어</span>
    <div class="lang-tabs">
      <button class="lang-tab active" data-lang="ko">한국어</button>
      <button class="lang-tab" data-lang="ja">日本語</button>
      <button class="lang-tab" data-lang="zh">中文</button>
      <button class="lang-tab" data-lang="en">English</button>
    </div>
  </div>

  <div class="chat-messages" id="chat-messages">
    <div class="typing-indicator" id="typing-indicator">
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
    </div>
  </div>

  <div class="chat-input-area">
    <button class="mic-btn" id="mic-btn" title="음성 입력">🎤</button>
    <textarea
      class="chat-text-input"
      id="chat-input"
      rows="1"
      placeholder="메시지를 입력하거나 🎤 를 눌러 말하세요…"
    ></textarea>
    <button class="send-btn" id="send-btn" title="전송">➤</button>
  </div>

</div>

<!-- ③ MY PAGE SCREEN -->
<div class="screen" id="screen-mypage">

  <div class="page-header">
    <button class="back-icon" id="back-from-mypage">←</button>
    <div class="header-info">
      <div class="header-name">마이페이지</div>
      <div class="header-mode">프로필 설정</div>
    </div>
  </div>

  <div class="mypage-body">
    <div class="mypage-avatar-section">
      <div class="mypage-avatar-wrap">
        <img id="mypage-avatar-img" class="avatar-photo hidden" alt="프로필">
        <span class="avatar-fallback mypage-av-fallback">👤</span>
        <label class="avatar-edit-overlay" for="avatar-file-input">
          <span class="camera-icon">📷</span>
        </label>
        <input type="file" id="avatar-file-input" accept="image/*">
      </div>
      <p class="mypage-hint">사진을 눌러 프로필 사진 변경</p>
    </div>

    <div class="mypage-actions">
      <button class="mypage-delete-btn" id="delete-avatar-btn">프로필 사진 삭제</button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="/static/js/app.js"></script>
</body>
</html>
